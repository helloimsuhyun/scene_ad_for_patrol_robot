name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: ["ant_branch"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: sentrynexcontrol
        run: flutter pub get

      - name: Build web
        working-directory: sentrynexcontrol
        run: flutter build web --release --base-href /capston_patrol_server/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sentrynexcontrol/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4