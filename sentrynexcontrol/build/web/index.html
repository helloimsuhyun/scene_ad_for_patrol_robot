<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sentrynexcontrol">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sentrynexcontrol</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    //---------- 인터넷 없는 환경을 위한 서비스 워커 강제 제거 ----------
    if (window.navigator && navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    //---------- 로딩 상태 모니터링 ----------
    window.addEventListener('load', function(ev) {
      setTimeout(function() {
        if (!window._flutter) {
          console.error('Flutter 부트스트랩 로드 실패');
          // 사용자에게 가시적으로 알림 (흰 화면 방지)
          document.body.innerHTML = '<div style="color:white; background:#11121A; height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:sans-serif;">' +
            '<h2>GUI 실행 실패 (인터넷 연결 필요 또는 캐시 문제)</h2>' +
            '<p>1. 브라우저 캐시를 삭제하고 다시 시도해주세요.</p>' +
            '<p>2. 빌드 시 --web-renderer html 옵션을 사용했는지 확인해주세요.</p>' +
            '</div>';
        }
      }, 5000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
